[package]
name = "goup"
version = "0.13.0"
authors = ["thinkgo <thinkgo@aliyun.com>", "Jason Swift <anemele@outlook.com>"]
edition = "2024"
rust-version = "1.88"
description = "goup is an elegant Go version manager"
keywords = ["goup", "golang", "version-manager", "tool", "rust"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/anemele/goup"
repository = "https://github.com/anemele/goup"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
shadow-rs = "1.5"
dialoguer = "0.12"
colored = "3.0.0"
anyhow = "1.0"
log = "0.4"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8.0"
indicatif = "0.18.3"
dirs = "6.0"
semver = "1.0"
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
zip = "7.0"

[target.'cfg(windows)'.dependencies]
junction = "1.3"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
# unused = "allow" # for experimental dev

[build-dependencies]
version_check = "0.9"
shadow-rs = "1.5"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
